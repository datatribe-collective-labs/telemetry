# Lint + unit tests on every pull request and on pushes to main (#62).
# Integration tests (live JPL Horizons) and the Airflow DAG tests are not run here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.5" # same uv as the Docker images
          python-version: "3.12"
          enable-cache: true

      - name: Lint
        run: uv run --locked ruff check .

      # Same command as the `tests` compose service: pytest collects every package's tests.
      - name: Unit tests
        run: uv run --locked --all-packages pytest -p no:cacheprovider
