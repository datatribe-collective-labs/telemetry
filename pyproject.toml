[project]
name = "telemetry"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
package = false

# pytest always runs with the repo root as its rootdir/configfile (that's how
# `uv run --package <pkg> pytest` invokes it), so ini options for any
# package's tests must live here, not in that package's own pyproject.toml.
# Tests live in the root tests/ dir, split by type and mirroring the source
# path: tests/{unit,integration}/<package>/<module path>/test_<function>.py.
# importlib mode lets unit/ and integration/ reuse the same test file names.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: requires the timescaledb_test Docker service (see tests/integration/)",
]
