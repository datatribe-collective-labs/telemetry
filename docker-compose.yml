services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Unit tests run in a clean container with the repository mounted read-only.
  # Run with: docker compose run --rm tests
  tests:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles: ["test"]
    working_dir: /app
    volumes:
      - .:/app:ro
      - uv_cache:/root/.cache/uv
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_FROZEN: "1"
      UV_LINK_MODE: copy
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["uv", "run", "--package", "pipelines", "pytest", "-p", "no:cacheprovider"]

  orion-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      RUN_ORION_TIMESCALE_INTEGRATION: "1"
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
  uv_cache: