services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 10

  physics_models:
    build:
      context: .
      dockerfile: packages/physics_models/Dockerfile
    environment:
      PHYSICS_MODELS_CONFIG: /app/packages/physics_models/configs/docker.yaml
      # Demo replay speed / seek (1.0 = real-time; 300 ≈ flyby in ~24 min)
      PHYSICS_MODELS_TIME_SCALE: ${PHYSICS_MODELS_TIME_SCALE:-1.0}
      PHYSICS_MODELS_START_MET_SECONDS: ${PHYSICS_MODELS_START_MET_SECONDS:-0.0}
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  physics_models_consumer:
    build:
      context: .
      dockerfile: packages/physics_models/Dockerfile.consumer
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Unit tests run in a clean container with the repository mounted read-only.
  # Run with: docker compose run --rm tests
  tests:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles: ["test"]
    working_dir: /app
    volumes:
      - .:/app:ro
      - uv_cache:/root/.cache/uv
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_FROZEN: "1"
      UV_LINK_MODE: copy
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["uv", "run", "--package", "pipelines", "pytest", "-p", "no:cacheprovider"]

  orion-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      RUN_ORION_TIMESCALE_INTEGRATION: "1"
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
  uv_cache: