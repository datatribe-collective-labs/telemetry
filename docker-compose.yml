x-timescaledb-common: &timescaledb-common
  image: timescale/timescaledb:latest-pg16
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  timescaledb:
    <<: *timescaledb-common
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  # Ephemeral database for `pytest` (packages/pipelines). Separate port/database
  # from the dev `timescaledb` service above so tests can never touch dev data.
  # No named volume - safe to wipe/recreate at any time.
  timescaledb_test:
    <<: *timescaledb-common
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry_test
    ports:
      - "5434:5432"

volumes:
  timescaledb_data:
