# The Digital Twin dashboard (dashboard/src/prototype). A virtual workspace member:
# it only declares the dependencies the dashboard needs and is not built or installed
# (pages import each other as `dashboard.src.prototype...` from the repo root).
#
#   uv run --package dashboard streamlit run dashboard/src/prototype/app.py
[project]
name = "dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "streamlit>=1.50",
    "httpx>=0.28.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.22",
]

[tool.uv]
package = false

[tool.uv.sources]
contracts = { workspace = true }
