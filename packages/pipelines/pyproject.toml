[project]
name = "pipelines"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "confluent-kafka>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "psycopg[binary]>=3.1",
]

[tool.uv.sources]
contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
