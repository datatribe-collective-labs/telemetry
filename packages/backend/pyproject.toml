[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.1",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "httpx>=0.28.1",
    "alembic>=1.20.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
