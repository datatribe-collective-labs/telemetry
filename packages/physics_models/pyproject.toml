[project]
name = "physics_models"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "confluent-kafka>=2.0",
    "numpy>=1.26",
    "pydantic>=2",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"