apiVersion: v3.1.0
kind: DataContract
id: 5d7e9f1a-3b4c-4d5e-1f2a-7b8c9d0e1f2a
name: radiation_model_output
version: 1.0.0
status: active
domain: spacecraft_digital_twin

description:
  purpose: >
    Radiation dose accumulation and hardware degradation model for Artemis II.
    Based on AP-8 MAX (inner belt protons) and AE-8 MAX (outer belt electrons)
    empirical models, calibrated to Orion's shielding (~100 mil Al equivalent
    at avionics/array level). Dose rate is position-driven from OEM trajectory.
    Published to Kafka topic `telemetry`. Degradation factors are published
    to the cross-model state bus for consumption by thermal and power models.
  limitations: >
    Simplified analytic fits to AP-8/AE-8, not a full SPENVIS run.
    Shielding factor (0.15) approximates 100 mil Al transmission.
    The single identified eclipse/belt transit for Artemis II occurs at MET 25.7h.
  authoritativeDefinitions:
    - url: https://doi.org/10.1002/9781119971009
      type: businessDefinition
      description: "[Source #1] Fortescue et al., Spacecraft Systems Engineering 4th ed., Ch. 2 — general radiation environment."
    - url: https://www.nasa.gov/smallsat-institute/sst-soa/radiation/
      type: businessDefinition
      description: NASA AP-8 MAX / AE-8 MAX trapped radiation belt models

team:
  - username: ${DATA_PRODUCT_OWNER}
    role: Data Product Owner
    description: Configured at deployment

servers:
  - server: ${KAFKA_PRODUCTION_SERVER}
    environment: production
    type: kafka
    host: ${KAFKA_BOOTSTRAP_SERVERS}
    topic: ${KAFKA_TELEMETRY_TOPIC}

schema:
  - id: radiation_output
    name: radiation_output
    physicalType: topic
    physicalName: telemetry
    properties:

      - id: rad_timestamp_utc
        name: timestamp_utc
        logicalType: string
        logicalTypeOptions:
          format: date-time
        physicalType: TIMESTAMP WITH TIME ZONE
        required: true
        primaryKey: true
        quality:
          - metric: nullValues
            mustBe: 0

      - id: total_dose_rate_rad_s
        name: total_dose_rate_rad_s
        businessName: Total absorbed dose rate (rad/s)
        logicalType: number
        physicalType: DOUBLE
        required: true
        description: >
          Total absorbed dose rate from the selected environment components after the
          declared shielding/transport model. AP-8/AE-8 provide particle flux spectra,
          not a universal rad/s dose rate; dose requires energy-dependent transport
          [Source #5, Source #6].
        quality:
          - metric: nullValues
            mustBe: 0
          - type: text
            description: >
              Must be ≥ 0. No hard 50, 7.5 or 10 rad/s ceiling is source-supported.
              The previous 0.050 rad/s versus 0.0075 rad/s values depended on an
              unverified scalar shielding factor and are removed [Source #5, Source #6].
      - id: cumulative_dose_krad
        name: cumulative_dose_krad
        businessName: Cumulative absorbed dose (krad Si)
        logicalType: number
        physicalType: DOUBLE
        required: true
        criticalDataElement: true
        description: >
          Total absorbed dose since mission start, krad(Si), at the declared detector/
          shielding location. Monotonically non-decreasing. A mission-total prediction
          is not a hard validity bound without a mission-specific radiation analysis.
        quality:
          - metric: nullValues
            mustBe: 0
          - type: text
            description: >
              Must be ≥ 0 and monotonically non-decreasing across ticks. No hard
              mission-total dose interval is asserted from the supplied sources.
      - id: solar_array_degradation
        name: solar_array_degradation
        businessName: Solar array degradation factor (relative to BOL)
        logicalType: number
        physicalType: DOUBLE
        required: true
        description: >
          Multiplicative efficiency factor relative to BOL. Degradation must be derived
          from particle fluence/energy-equivalent damage using cell-specific radiation-
          response data [Source #8]. A universal 1%/krad law and 0.60 floor are not
          source-supported.
        quality:
          - metric: nullValues
            mustBe: 0
          - type: text
            description: >
              Require 0 < solar_array_degradation ≤ 1.0. If irreversible accumulated
              radiation damage is modeled, the factor must be non-increasing [Source #8].
      - id: thermal_alpha_degradation
        name: thermal_alpha_degradation
        businessName: Thermal coating absorptivity factor
        logicalType: number
        physicalType: DOUBLE
        required: true
        description: >
          Multiplicative factor on surface absorptivity. Radiation-induced optical-property
          change should be represented as α(D) when coating test data support it [Source #9].
          The previous +0.5%/krad and +15% cap are not source-verified.
        quality:
          - metric: nullValues
            mustBe: 0
          - type: text
            description: >
              The resulting absolute absorptivity must satisfy 0 ≤ α ≤ 1. Any factor
              range or monotonicity must come from coating test data [Source #9].
      - id: thermal_eps_degradation
        name: thermal_eps_degradation
        businessName: Thermal coating emissivity factor
        logicalType: number
        physicalType: DOUBLE
        required: true
        description: >
          Multiplicative factor on surface emissivity. Radiation-induced emissivity
          change should be represented as ε(D) when coating test data support it [Source #9].
          The previous −0.2%/krad and 0.85 floor are not source-verified.
        quality:
          - metric: nullValues
            mustBe: 0
          - type: text
            description: >
              The resulting absolute emissivity must satisfy 0 ≤ ε ≤ 1. Any factor range
              and monotonicity must be established from coating data [Source #9].
      - id: radiation_dose_rate_mrad_hr
        name: radiation_dose_rate_mrad_hr
        businessName: Dose rate in telemetry-friendly units (mrad/hr)
        logicalType: number
        physicalType: DOUBLE
        required: true
        description: >
          total_dose_rate_rad_s × 1000 × 3600. Provided in mrad/hr for
          compatibility with standard radiation monitor telemetry formats.
        quality:
          - metric: nullValues
            mustBe: 0
          - type: text
            description: >
              Must equal total_dose_rate_rad_s × 3,600,000 within floating-point precision.
              Must be ≥ 0. Same physical bound: ≤ 36,000 mrad/hr (10 rad/s equivalent).

      - id: sep_event_active
        name: sep_event_active
        businessName: SEP event in progress
        logicalType: boolean
        physicalType: BOOLEAN
        required: true
        description: >
          True when NOAA proton flux > 10 pfu (S1 storm threshold).
          Sourced from SpaceWeatherSnapshot.proton_flux_pfu from DONKI.
        quality:
          - metric: nullValues
            mustBe: 0
          - type: text
            description: >
              Must be consistent with the upstream space weather data:
              sep_event_active = True ↔ proton_flux_pfu > 10.0 pfu.
              Any inconsistency between this field and the space weather input
              indicates a data pipeline join failure.
